<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11.2.6/swiper-bundle.min.css" data-only-with="swiper">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/pages.css">
<script>try{if(sessionStorage.getItem('rc-visited'))document.documentElement.classList.add('is-return')}catch(e){}</script>
</head>
<body data-folder="{{folder}}" data-template="{{template}}">

<!-- nav template: main.js puts one copy on the page; the sections' nav-slots set its theme -->
<!-- @include nav -->

<main class="page">

{{content}}

<!-- @include footer -->

</main>

<!-- @include modal -->

<script src="/main.js"></script>
<script src="/reels.js"></script>
</body>
</html>
